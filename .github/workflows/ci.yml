name: Auth Service Pipeline

on:
  push:
    branches:
      - staging

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-test
    environment: staging

    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ vars.SERVER_KEY }}
        run: |
          mkdir -p ~/key
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/key/mykey.pem
          chmod 600 ~/key/mykey.pem

      - name: Run deployment
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > /tmp/env_content

          scp -i ~/key/mykey.pem -o StrictHostKeyChecking=no /tmp/env_content ec2-user@api.truewaysindia.com

          ssh -i ~/key/mykey.pem -o StrictHostKeyChecking=no ec2-user@api.truewaysindia.com << 'EOF'

            echo "Current directory check:"
            pwd
            
            echo "Source Bash"
            source ~/.bashrc

            echo "Changing directory..."
            cd Desktop/vibely/backend/Authetication

            echo "Checking pwd:"
            pwd

            echo "Checking out staging branch..."
            git checkout staging
            git pull origin staging

            echo "Installing dependencies..."
            npm i

            echo "Removing Old Dist"
            rm -r dist

            echo "Building project..."
            npm run build

            echo "Copy Package json"
            cp package.json ./dist/

            echo "Going to dist"
            cd dist

            echo "Moving .env file from tmp"
            mv /tmp/.env.tmp .env

            echo "Reloading PM2..."
            npx pm2 reload authentication
          EOF
