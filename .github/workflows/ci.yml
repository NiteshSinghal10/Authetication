name: Auth Service Pipeline

on:
  push:
    branches:
      - staging

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ vars.SERVER_KEY }}
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: |
          mkdir -p ~/key
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/key/mykey.pem
          chmod 600 ~/key/mykey.pem

      - name: Run deployment over Cloudflare SSH
        run: |
          ssh -i ~/key/mykey.pem -o StrictHostKeyChecking=no -o ProxyCommand="cloudflared access ssh --hostname ssh.vib3ly.shop" nitesh@ssh.vib3ly.shop << 'EOF'

            echo "Current directory check:"
            pwd
            
            echo "Source Bash"
            source ~/.bashrc

            echo "Changing directory..."
            cd Desktop/vibely/backend/Authetication

            echo "Checking pwd:"
            pwd

            echo "Checking out staging branch..."
            git checkout staging
            git pull origin staging

            echo "Installing dependencies..."
            npm i

            echo "Removing Old Dist"
            rm -r dist

            echo "Building project..."
            npm run build

            echo "Copy Package json"
            cp package.json ./dist/

            echo "Going to dist"
            cd dist

            echo "Consoling ENV"
            echo "$ENV_FILE"

            echo "Creating .env"
            echo "$ENV_FILE" > .env

            echo "Reloading PM2..."
            npx pm2 reload authentication
          EOF
